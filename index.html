  }
  if (currentPhotoMemos().length >= PHOTO_MEMO_MAX) {
    toast(`この客先の写真メモは最大${PHOTO_MEMO_MAX}枚までです`, "error");
    return;
  }
  try {
    const dataUrl = await compressImageFile(file);
    setCurrentPhotoMemos([
      ...currentPhotoMemos(),
      { id: "p" + Date.now() + Math.random().toString(36).slice(2, 6), dataUrl, takenAt: new Date().toISOString() }
    ]);
    render();
    const shared = await pushSharedPhotoDraft();
    if (shared && shared.ok) {
      toast(`${state.customer} の写真メモを追加しました（他端末・伝票と共有）`);
    } else {
      toast(photoShareErrorHint(shared && shared.error), "error");
    }
  } catch (e) {
    console.error(e);
    toast(e.message || "写真の取り込みに失敗しました", "error");
  }
}

function removePhotoMemo(id) {

function buildLedgerRecord() {
  const user = auth.currentUser;
  const photos = currentPhotoMemos().map(p => ({
    id: p.id,
    dataUrl: p.dataUrl,
    takenAt: p.takenAt || new Date().toISOString()
  }));
  return {
    id: Date.now(),
    customer: state.customer,
    deliveryDate: state.deliveryDate || todayInput(),
    lotNo: state.lotNo || "",
    items: state.items.map(it => ({
      code: it.code,
      name: it.name,
      inQty: parseInt(it.inQty, 10) || 0,
      outQty: parseInt(it.outQty, 10) || 0
    })),
    photos,
    createdAt: new Date().toISOString(),
    createdBy: user?.uid || "",
    createdByEmail: state.demoMode ? "試用モード" : (state.userDisplayName || state.userShortId || ""),
  };
}

function hasAnyQty(record) {
  return record.items.some(it => (it.outQty > 0) || (it.inQty > 0));
}

function hasPhotoMemos(record) {
  return Array.isArray(record?.photos) && record.photos.length > 0;
}

async function saveLedger() {
  applyBuffer();
  if (!state.customer) { toast("客先を選択してください", "error"); return; }
  if (!state.lotNo) { toast("ロット番号を選んでください", "error"); return; }
  const record = buildLedgerRecord();
  if (!hasAnyQty(record) && !hasPhotoMemos(record)) {
    toast("数量を入力するか、写真メモを撮ってください", "error");
    return;
  }
  state.ledgers = applyLedgerRetention([record, ...state.ledgers]);
  try {
    // 写真は先に共有コレクションへ（ledgerRecords に dataUrl を載せると 1MB で落ちやすい）
    let photoShared = false;
    if (hasPhotoMemos(record)) {
      photoShared = await pushSharedPhotoSaved(record);
      if (!photoShared) {
        toast("写真のクラウド共有に失敗しました。ネットを確認してから再保存してください", "error");
        state.ledgers = state.ledgers.filter(l => l.id !== record.id);
        return null;
      }
    }
    if (state.demoMode) {
      cacheLedgers();
    } else {
      const recordForCloud = {
        ...record,
        photos: (record.photos || []).map(p => ({ id: p.id, takenAt: p.takenAt || "" }))
      };
      await addDoc(collection(db, "ledgerRecords"), recordForCloud);
      await pruneOldLedgersFromCloud();
      cacheLedgers();
    }
    toast(state.demoMode
      ? (IS_DEMO ? "台帳を保存しました（デモ・この端末のみ）"
        : SKIP_LOGIN && !IS_LOCAL
          ? (photoShared ? "台帳を保存しました（写真は他端末・伝票と共有）" : "台帳を保存しました（仮運用・この端末のみ）")
          : "台帳を保存しました（試用・この端末のみ）")
      : (photoShared ? "台帳を保存しました（写真共有済み）" : "台帳を保存しました"));
    state.items = state.items.map(it => ({ ...it, inQty: "", outQty: "" }));
    setCurrentPhotoMemos([]); // 保存した客先の写真だけクリア（他客先の下書きは残す）
    state.focus = null;
    state.buffer = "";
    ensureLotPersists(); // 保存後も同じロットで続行
    render();
    return record;
  } catch (e) {
    console.error(e);
    state.ledgers = state.ledgers.filter(l => l.id !== record.id);
    const tooBig = /exceeds|too large|size|1MB|1048576/i.test(String(e?.message || e));
    toast(tooBig ? "写真が大きすぎて保存できませんでした。枚数を減らして再試行してください" : "保存に失敗しました", "error");
    return null;
  }
}

  const groups = managedGroups();
  const groupRows = groups.map((g, i) => `
    <div class="master-row">
      <div class="master-row-body">
        <div class="master-row-title">${esc(g.name)}</div>
        <div class="master-row-meta">客先 ${g.count} 件</div>
      </div>
      <div class="master-row-actions">
        <button type="button" class="master-btn master-btn-move" data-group-move="${esc(g.name)}" data-dir="-1" ${i > 0 ? "" : "disabled"} aria-label="上へ">↑</button>
        <button type="button" class="master-btn master-btn-move" data-group-move="${esc(g.name)}" data-dir="1" ${i < groups.length - 1 ? "" : "disabled"} aria-label="下へ">↓</button>
        <button type="button" class="master-btn master-btn-edit" data-group-edit="${esc(g.name)}">編集</button>
        <button type="button" class="master-btn master-btn-del" data-group-del="${esc(g.name)}">削除</button>
      </div>
    </div>`).join("");

  const masterCust = state.masterCustomer || state.customers[0]?.name || "";
  const filteredItems = masterCust
    ? filterCustomerItemsWithIndex(masterCust, state.masterItemQuery, state.masterItemKanaRow)
    : [];
  const totalItems = masterCust ? customerItemRows(masterCust).length : 0;
  const canReorderItems = fullEdit && masterItemReorderEnabled();
  const itemRows = filteredItems.map(({ p, index }) => {
    const canUp = canReorderItems && index > 0;
    const canDown = canReorderItems && index < totalItems - 1;
    return `
    <div class="master-row">
      <div class="master-row-body">
        <div class="master-row-title">${esc(p.name)}</div>
        <div class="master-row-meta">${p.yomi ? `読み ${esc(p.yomi)} · ` : ""}${p.code ? `コード ${esc(p.code)}` : "コードなし"}</div>
      </div>
      ${fullEdit ? `<div class="master-row-actions">
        <button type="button" class="master-btn master-btn-move" data-master-move-item="${index}" data-dir="-1" ${canUp ? "" : "disabled"} aria-label="上へ">↑</button>
        <button type="button" class="master-btn master-btn-move" data-master-move-item="${index}" data-dir="1" ${canDown ? "" : "disabled"} aria-label="下へ">↓</button>
        <button type="button" class="master-btn master-btn-edit" data-master-edit-item="${index}">編集</button>
        <button type="button" class="master-btn master-btn-del" data-master-del-item="${index}">削除</button>
      </div>` : ""}
    </div>`;
  }).join("");
  const kanaOpts = KANA_ROW_OPTIONS.filter(r => r.key !== "").map(r =>
    `<option value="${esc(r.key)}" ${state.masterItemKanaRow === r.key ? "selected" : ""}>${esc(r.label)}</option>`
  ).join("");
  const itemEmptyMsg = !masterCust
    ? "客先を登録してください"
    : (totalItems === 0
      ? "品目がありません"
      : (filteredItems.length === 0 ? "条件に合う品目がありません" : ""));

  const custOpts = renderCustomerSelectOptions(masterCust);

  const note = "客先・グループ・品目を管理できます。伝票アプリのマスタは変更しません。";

  let body = "";
  if (customerSection) {
    body = `
      <div class="master-toolbar-actions">
        <button type="button" class="master-add" id="master-add-customer">＋ 客先を追加</button>
        <button type="button" class="btn" id="master-sort-customers">名前順に並べ替え</button>
        <span style="font-size:12px;color:#666">↑↓でグループ内の順番を変更（伝票アプリと共有）</span>
      </div>
      <div class="master-list">${custRows || `<div class="empty" style="padding:24px">客先がありません</div>`}</div>`;
  } else if (groupSection) {
    body = `
      <p class="sync-note" style="margin:0 0 10px">グループの追加・改名・並べ替え・削除ができます。削除すると所属客先は未分類になります。</p>
      <div class="master-toolbar-actions">
        <button type="button" class="master-add" id="master-add-group">＋ グループを追加</button>
      </div>
      <div class="master-list">${groupRows || `<div class="empty" style="padding:24px">グループがありません</div>`}</div>`;
  } else {
    body = `
      <div class="master-toolbar">
        <select id="master-cust-select">${state.customers.length ? custOpts : `<option value="">客先がありません</option>`}</select>
      </div>
      <div style="display:grid;grid-template-columns:130px 1fr;gap:8px;margin:10px 0 6px">
        <div>
          <label class="lbl">行</label>
          <select id="master-item-kana">${kanaOpts}</select>
        </div>
        <div>
          <label class="lbl">検索（品名・読み・コード）</label>
          <input type="text" id="master-item-query" value="${esc(state.masterItemQuery)}" placeholder="キーワード">
        </div>
      </div>
      <div class="master-view-controls">
        <div class="row-btns" role="group" aria-label="品目の列数">
          ${ITEM_COLS_OPTIONS.map(c =>
            `<button type="button" class="btn-mcol${state.masterItemCols === c ? " active" : ""}" data-master-cols="${c}">${c}列</button>`
          ).join("")}
        </div>
        <div class="zoom-btns" role="group" aria-label="品目の表示倍率">
          <button type="button" class="btn-mzoom" id="master-zoom-out" aria-label="縮小" ${state.masterItemZoom <= ZOOM_MIN ? "disabled" : ""}>−</button>
          <span class="mzoom-label">${Math.round(state.masterItemZoom * 100)}%</span>
          <button type="button" class="btn-mzoom" id="master-zoom-in" aria-label="拡大" ${state.masterItemZoom >= ZOOM_MAX ? "disabled" : ""}>＋</button>
        </div>
      </div>
      <p class="sync-note" style="margin:0 0 8px">${totalItems ? `${filteredItems.length} / ${totalItems} 件` : "品目なし"} · ${canReorderItems ? "↑↓で並べ替え（入力画面にも反映）" : "並べ替えは検索を空にしてから"} · ${state.masterItemCols}列</p>
      <button type="button" class="master-add" id="master-add-item" ${state.customers.length ? "" : "disabled"}>＋ 品目を追加</button>
      <div class="master-list cols" style="margin-top:10px;--master-cols:${state.masterItemCols};--mz:${state.masterItemZoom}">${itemRows || `<div class="empty master-empty" style="padding:24px">${esc(itemEmptyMsg)}</div>`}</div>`;
  }

  return `
    <div class="card" style="margin-bottom:12px">
      <p class="sync-note" style="margin:0 0 10px">${note}</p>
      ${fullEdit ? `<div class="master-subtabs">
        <button type="button" class="master-subtab${customerSection ? " active" : ""}" data-master-section="customers">客先</button>
        <button type="button" class="master-subtab${groupSection ? " active" : ""}" data-master-section="groups">グループ</button>
        <button type="button" class="master-subtab${itemSection ? " active" : ""}" data-master-section="items">品目</button>
      </div>` : ""}
      ${body}
    </div>`;
}

function renderMasterForm() {
  const f = state.masterForm;
  if (!f) return "";
  if (f.kind === "group") {
    const title = f.mode === "add" ? "グループを追加" : "グループを編集";
    return `
    <div class="detail-overlay" id="master-form-overlay">
      <div class="master-form-panel">
        <h3>${title}</h3>
        <label class="lbl">グループ名</label>
        <input type="text" id="master-form-name" value="${esc(f.name)}" placeholder="例：医療 / 飲食 / 法人">
        <p style="font-size:11px;color:#888;margin:-4px 0 10px">名前を変えると、所属する客先もまとめて更新されます</p>
        <div class="master-form-actions">
          <button type="button" class="btn btn-ghost" id="master-form-cancel" style="background:#f4f3ef;color:#1a1a2e">キャンセル</button>
          <button type="button" class="btn btn-primary" id="master-form-save">保存</button>
        </div>
      </div>
    </div>`;
  }
  const isCustomer = f.kind === "customer";
  const isItemAdd = !isCustomer && f.mode === "add";
  const title = isCustomer
    ? (f.mode === "add" ? "客先を追加" : "客先を編集")
    : (f.mode === "add" ? "品目を追加" : "品目を編集");
  const groupOpts = existingCustomerGroups()
    .map(g => `<option value="${esc(g)}"></option>`)
    .join("");
  const custName = f.customer || state.masterCustomer;
  const formHits = isItemAdd
    ? searchItemsForMasterAdd(custName, f.searchQuery || "", f.searchKana || "all")
    : [];
  const formHasFilter = !!(String(f.searchQuery || "").trim() || (f.searchKana && f.searchKana !== "all" && f.searchKana !== ""));
  const formHitRows = formHits.length
    ? formHits.map((h, i) => `
      <button type="button" class="item-add-hit" data-master-pick="${i}">
        <div>
          <div class="item-add-hit-title">${esc(h.name)}</div>
          <div class="item-add-hit-meta">${h.yomi ? `読み ${esc(h.yomi)} · ` : ""}${h.code ? `コード ${esc(h.code)} · ` : ""}${h.fromCustomer ? esc(h.fromCustomer) : ""}</div>
        </div>
        <span style="font-size:12px;font-weight:700;color:#0288D1">使う</span>
      </button>`).join("")
    : (isItemAdd
      ? `<div class="empty" style="padding:14px">${formHasFilter ? "該当なし（この客先に無い品目のみ表示）" : "あ行を選ぶかキーワードを入力 → 既存品目をコピーできます"}</div>`
      : "");
  const kanaOpts = KANA_ROW_OPTIONS.filter(r => r.key !== "").map(r =>
    `<option value="${esc(r.key)}" ${(f.searchKana || "all") === r.key ? "selected" : ""}>${esc(r.label)}</option>`
  ).join("");
  return `
    <div class="detail-overlay" id="master-form-overlay">
      <div class="master-form-panel">
        <h3>${title}</h3>
        ${!isCustomer ? `<p style="font-size:13px;color:#666;margin-bottom:10px">客先：${esc(custName)}</p>` : ""}
        ${isItemAdd ? `
        <div style="background:#f7fafc;border:1px solid #e2eef6;border-radius:10px;padding:10px 12px;margin-bottom:14px">
          <div class="lbl" style="margin-bottom:6px">既存マスタから探す</div>
          <div style="display:grid;grid-template-columns:120px 1fr;gap:8px">
            <div>
              <label class="lbl">行</label>
              <select id="master-form-search-kana">${kanaOpts}</select>
            </div>
            <div>
              <label class="lbl">キーワード</label>
              <input type="text" id="master-form-search-query" value="${esc(f.searchQuery || "")}" placeholder="品名・読み・コード">
            </div>
          </div>
          <div class="master-form-search-list">${formHitRows}</div>
        </div>
        <p style="font-size:12px;font-weight:700;color:#555;margin:0 0 8px">または手入力で新規登録</p>
        ` : ""}
        <label class="lbl">${isCustomer ? "客先名" : "品名"}</label>
        <input type="text" id="master-form-name" value="${esc(f.name)}" placeholder="${isCustomer ? "例：客先A" : "例：作業着（上）"}">
        ${isCustomer ? `<label class="lbl">グループ1（任意）</label>
        <input type="text" id="master-form-group" list="master-group-list" value="${esc(f.group || "")}" placeholder="例：医療 / 飲食 / 法人">
        <label class="lbl">グループ2（任意・最大2つ）</label>
        <input type="text" id="master-form-group2" list="master-group-list" value="${esc(f.group2 || "")}" placeholder="2つ目があれば入力">
        <datalist id="master-group-list">${groupOpts}</datalist>
        <p style="font-size:11px;color:#888;margin:-4px 0 10px">最大2つまで所属できます。グループタブで追加・改名もできます</p>` : ""}
        ${!isCustomer ? `
        <label class="lbl">読み仮名（あ行検索用）</label>
        <input type="text" id="master-form-yomi" value="${esc(f.yomi || "")}" placeholder="例：さぎょうぎうえ" inputmode="kana">
        <p style="font-size:11px;color:#888;margin:-4px 0 10px">ひらがな・カタカナどちらでも可。漢字品名の行分けに使います</p>
        <label class="lbl">コード（P始まり）</label>
        <input type="text" id="master-form-code" value="${esc(f.code)}" placeholder="例：P001">` : ""}
        <div class="master-form-actions">
          <button type="button" class="btn btn-ghost" id="master-form-cancel" style="background:#f4f3ef;color:#1a1a2e">キャンセル</button>
          <button type="button" class="btn btn-primary" id="master-form-save">保存</button>
        </div>
      </div>
    </div>`;
}

function renderDetail(ledger) {
  const rows = ledger.items
    .filter(it => it.outQty > 0 || it.inQty > 0)
    .map(it => `<tr><td>${esc(it.name)}</td><td class="num">${it.outQty || it.inQty || "—"}</td></tr>`)
    .join("");
  const photos = Array.isArray(ledger.photos) ? ledger.photos.filter(p => p && p.dataUrl) : [];
  const photoBlock = photos.length
    ? `<div style="margin:12px 0 4px">
        <div class="lbl" style="margin-bottom:6px">写真メモ（${photos.length}）· タップで拡大</div>
        <div class="photo-memo-thumbs">${photos.map(p => `
          <div class="photo-memo-thumb" style="width:88px;height:88px">
            <img src="${p.dataUrl}" alt="写真メモ" data-photo-view-url="1">
          </div>`).join("")}</div>
      </div>`
    : "";
  return `
    <div class="detail-overlay" id="detail-overlay">
      <div class="detail-panel">
        <h2>${esc(ledger.customer)}</h2>
        <p style="font-size:13px;color:#666">${fmtDate(ledger.deliveryDate)} · 保存 ${fmtDate(ledger.createdAt)} ${fmtTime(ledger.createdAt)}${ledger.lotNo ? ` · ロット ${esc(ledger.lotNo)}` : ""}</p>
        <table class="detail-table"><thead><tr><th>品名</th><th>数量</th></tr></thead><tbody>${rows || `<tr><td colspan="2" style="color:#888">数量なし（写真メモのみ）</td></tr>`}</tbody></table>
        ${photoBlock}
        <div class="memo-actions">
          <button class="btn btn-ghost" id="detail-delete" style="background:#fff3e0;color:#c62828">削除</button>
          <button class="btn btn-primary" id="detail-close">閉じる</button>
        </div>
      </div>
    </div>`;
}

function renderPhotoView() {
  if (!state.photoView) return "";
  return `
    <div class="photo-view-overlay" id="photo-view-overlay">
      <button type="button" class="photo-view-close" id="photo-view-close">閉じる</button>
      <img src="${state.photoView}" alt="写真メモ（拡大）">
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function render() {
  if (!isActiveSession()) return;
  applyDeviceLayout();
  const showNumpad = state.tab === 0;
  const focusLabel = state.focus
    ? `${state.items[state.focus.index]?.name || ""} の数量`
    : "";
  const numpadHint = focusLabel
    ? `入力中：<strong>${esc(focusLabel)}</strong>`
    : "数量をタップしてください";

  document.getElementById("root").innerHTML = `
    <div class="app">
      ${IS_DEMO ? `<div class="demo-banner">⚠ お試し（デモ）環境です。伝票デモとマスタ連動中・この端末のみ。</div>` : ""}
      <header class="header">
        <div class="header-brand"><h1>${IS_DEMO ? "【デモ】入出荷台帳" : "入出荷台帳"}</h1><div class="header-sub">${esc(sessionLabel())}${state.lotNo ? ` · ロット ${esc(state.lotNo)}` : " · ロット未選択"} · <span style="opacity:.55">${APP_BUILD}</span></div>${pcLinkBadgeHtml()}</div>
        <nav class="header-tabs" aria-label="画面切替">
          <button type="button" class="header-tab${state.tab === 0 ? " active" : ""}" data-tab="0">入力</button>
          <button type="button" class="header-tab${state.tab === 1 ? " active" : ""}" data-tab="1">履歴${state.ledgers.length ? ` (${state.ledgers.length})` : ""}</button>
          <button type="button" class="header-tab${state.tab === 2 ? " active" : ""}" data-tab="2">マスタ</button>
        </nav>
        <div class="header-actions">
          <div class="col-mode-controls${state.tab === 0 ? "" : " hidden"}">
            ${ITEM_COLS_OPTIONS.map(c =>
              `<button type="button" class="btn btn-ghost btn-col-mode${state.itemCols === c ? " active" : ""}" data-cols="${c}">${c}列</button>`
            ).join("")}
          </div>
          <div class="zoom-controls${state.tab === 0 ? "" : " hidden"}">
            <button type="button" class="btn btn-ghost btn-zoom" id="btn-zoom-out" aria-label="品目を縮小" ${state.itemZoom <= ZOOM_MIN ? "disabled" : ""}>−</button>
            <span class="zoom-label">${Math.round(state.itemZoom * 100)}%</span>
            <button type="button" class="btn btn-ghost btn-zoom" id="btn-zoom-in" aria-label="品目を拡大" ${state.itemZoom >= ZOOM_MAX ? "disabled" : ""}>＋</button>
          </div>
          ${state.tab === 0 ? `<button type="button" class="btn btn-primary" id="btn-save" style="padding:7px 14px">完了して保存</button>` : ""}
          <a class="btn btn-ghost" id="btn-guide" href="./guide.html" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">ガイド</a>
          <button type="button" class="btn btn-ghost install-btn hidden" id="btn-install">インストール</button>
          ${(USE_LOCAL_DEMO && state.demoMode) || (SKIP_LOGIN && !IS_DEMO) ? "" : `<button class="btn btn-ghost" id="btn-logout">${state.demoMode ? "終了" : "業務終了"}</button>`}
        </div>
      </header>
      <div class="workspace">
        <main class="main">
          ${state.loading ? `<div class="empty">読込中…</div>` : state.tab === 0 ? renderInputTab() : `<div class="main-scroll">${state.tab === 1 ? renderHistoryTab() : renderMasterTab()}</div>`}
        </main>
        <aside class="numpad-wrap${showNumpad ? "" : " hidden"}${state.focus ? "" : " disabled"}" aria-label="テンキー">
          <div class="sidebar-actions">
            <button type="button" class="btn btn-issue" id="btn-issue">伝票を発行</button>
          </div>
          <div class="numpad-target">${numpadHint}</div>
          <div class="numpad">
            ${["7","8","9","4","5","6","1","2","3"].map(n => `<button type="button" class="nk" data-k="${n}">${n}</button>`).join("")}
            <button type="button" class="nk del" data-k="del">DEL</button>
            <button type="button" class="nk" data-k="0">0</button>
            <button type="button" class="nk enter" data-k="enter">ENTER</button>
          </div>
          ${state.tab === 0 ? `
          <div style="margin-top:8px;flex-shrink:0;display:flex;flex-direction:column;gap:6px">
            <button type="button" class="item-add-btn" id="btn-item-add" ${state.customer ? "" : "disabled"}>＋ 品目を追加</button>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <button type="button" class="btn btn-ghost" id="btn-paper-scan" title="手書き台帳の点数をカメラで読む" ${state.customer && state.items.length ? "" : "disabled"} style="padding:6px 10px;font-size:12px;font-weight:700">📄 紙の点数</button>
              <input type="file" id="paper-scan-input" accept="image/*" capture="environment" style="display:none">
              <button type="button" class="btn btn-ghost" id="btn-photo-memo" title="この客先の写真メモ" aria-label="写真メモ" ${state.customer ? "" : "disabled"} style="padding:6px 10px;font-size:16px;min-width:40px;opacity:.75">${currentPhotoMemos().length ? `📷${currentPhotoMemos().length}` : "📷"}</button>
              <input type="file" id="photo-memo-input" accept="image/*" capture="environment" style="display:none">
              <div class="photo-memo-thumbs">${currentPhotoMemos().map(p => `
                <div class="photo-memo-thumb" style="width:40px;height:40px">
                  <img src="${p.dataUrl}" alt="写真メモ" data-photo-view="${esc(p.id)}" data-photo-src="memo">
                  <button type="button" class="photo-del" data-photo-del="${esc(p.id)}" aria-label="写真を削除">×</button>
                </div>`).join("")}</div>
            </div>
          </div>` : ""}
        </aside>
      </div>
    </div>
    ${state.detail ? renderDetail(state.detail) : ""}
    ${state.invoiceMemo ? renderInvoiceMemo(state.invoiceMemo) : ""}
    ${state.paperScan ? renderPaperScanModal() : ""}
    ${state.masterForm ? renderMasterForm() : ""}
    ${state.itemAddOpen ? renderItemAddPanel() : ""}
    ${state.photoView ? renderPhotoView() : ""}`;

  document.querySelectorAll(".header-tab").forEach(btn => {
    btn.onclick = async () => {
      state.tab = +btn.dataset.tab;
      state.focus = null;
      state.masterForm = null;
      state.itemAddOpen = false;
      if (state.tab === 1 && !state.loading) {
        try {
          if (!state.demoMode) await loadLedgersFromCloud();
          await mergeSharedPhotosToLedgers();
        } catch {}
      }
      if (state.tab === 2) {
        if (!canMasterFullEdit()) state.masterSection = "items";
        if (!state.masterCustomer && state.customers.length) state.masterCustomer = state.customers[0].name;
      }
      render();
    };
  });
  const logoutBtn = document.getElementById("btn-logout");
  if (logoutBtn) {
    logoutBtn.onclick = async () => {
      if (state.demoMode) {
        state.demoMode = false;
        state.customer = "";
        state.items = [];
        renderLogin();
      } else {
        await endWorkDay();
      }
    };
  }

  const zoomOut = document.getElementById("btn-zoom-out");
  const zoomIn = document.getElementById("btn-zoom-in");
  document.querySelectorAll(".btn-col-mode").forEach(btn => {
    btn.onclick = () => setItemCols(+btn.dataset.cols);
  });
  if (zoomOut) zoomOut.onclick = () => setItemZoom(state.itemZoom - ZOOM_STEP);
  if (zoomIn) zoomIn.onclick = () => setItemZoom(state.itemZoom + ZOOM_STEP);

  if (state.tab === 0 && !state.loading) {
    const sel = document.getElementById("cust-select");
    if (sel) sel.onchange = e => selectCustomer(e.target.value);
    const gsel = document.getElementById("cust-group-select");
    if (gsel) gsel.onchange = e => { state.custGroup = e.target.value; render(); };
    const dt = document.getElementById("delivery-date");
    if (dt) dt.onchange = e => {
      state.deliveryDate = e.target.value;
      state.deliveryDateFromCycle = false;
    };
    if (!state.deliveryDate) state.deliveryDate = dt?.value || todayInput();
    ensureLotPersists();
    const lotSel = document.getElementById("lot-select");
    if (lotSel) {
      if (state.lotNo && lotSel.value !== state.lotNo) lotSel.value = state.lotNo;
      lotSel.onchange = e => {
        const next = String(e.target.value || "").trim();
        if (!next && state.lotNo) {
          if (!confirm(`ロット ${state.lotNo} の継続をやめますか？`)) {
            lotSel.value = state.lotNo;
            return;
          }
        }
        saveLotNo(next);
        toast(state.lotNo ? `ロット ${state.lotNo} で進めます（切替まで継続）` : "ロット未選択");
        render();
      };
    };

    document.querySelectorAll(".qty-cell").forEach(el => {
      el.onclick = () => setFocus(+el.dataset.i, el.dataset.f);
    });
    document.querySelectorAll("[data-remove-item]").forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        removeInputItem(+btn.dataset.removeItem);
      };
    });
    const itemAddBtn = document.getElementById("btn-item-add");
    if (itemAddBtn) itemAddBtn.onclick = () => openItemAdd("free");

    const scrollEl = document.getElementById("items-scroll");
    const scrollUp = document.getElementById("scroll-up");
    const scrollDown = document.getElementById("scroll-down");
    if (scrollEl && scrollUp && scrollDown) {
      const scrollStep = () => Math.max(120, scrollEl.clientHeight * 0.55);
      scrollUp.onclick = () => scrollEl.scrollBy({ top: -scrollStep(), behavior: "smooth" });
      scrollDown.onclick = () => scrollEl.scrollBy({ top: scrollStep(), behavior: "smooth" });
    }
    requestAnimationFrame(() => applyItemColLayout());
  }

  const itemAddOverlay = document.getElementById("item-add-overlay");
  if (itemAddOverlay) {
    itemAddOverlay.onclick = e => { if (e.target === itemAddOverlay) closeItemAdd(); };
    document.querySelectorAll("[data-item-add-tab]").forEach(btn => {
      btn.onclick = () => {
        state.itemAddTab = btn.dataset.itemAddTab;
        render();
      };
    });
    const cancel = document.getElementById("item-add-cancel");
    if (cancel) cancel.onclick = () => closeItemAdd();
    const toMaster = document.getElementById("item-add-to-master");
    if (toMaster) toMaster.onchange = e => { state.itemAddToMaster = e.target.checked; };
    const nameInput = document.getElementById("item-add-name");
    if (nameInput) {
      nameInput.oninput = e => { state.itemAddName = e.target.value; };
      nameInput.onkeydown = e => {
        if (e.key === "Enter") {
          e.preventDefault();
          addItemToInput(nameInput.value, {
            toMaster: state.itemAddToMaster,
            yomi: document.getElementById("item-add-yomi")?.value || ""
          });
        }
      };
    }
    const yomiInput = document.getElementById("item-add-yomi");
    if (yomiInput) yomiInput.oninput = e => { state.itemAddYomi = e.target.value; };
    const saveFree = document.getElementById("item-add-save");
    if (saveFree) {
      saveFree.onclick = () => addItemToInput(
        document.getElementById("item-add-name")?.value || "",
        {
          toMaster: state.itemAddToMaster,
          yomi: document.getElementById("item-add-yomi")?.value || ""
        }
      );
    }
    const kanaSelect = document.getElementById("item-add-kana");
    if (kanaSelect) {
      kanaSelect.onchange = e => {
        state.itemAddKanaRow = e.target.value;
        render();
      };
    }
    const queryInput = document.getElementById("item-add-query");
    if (queryInput) {
      queryInput.oninput = e => {
        state.itemAddQuery = e.target.value;
        render();
        const q = document.getElementById("item-add-query");
        if (q) {
          q.focus();
          const len = q.value.length;
          q.setSelectionRange(len, len);
        }
      };
    }
    const hits = searchMasterItems(state.itemAddQuery, state.itemAddKanaRow);
    document.querySelectorAll("[data-add-hit]").forEach(btn => {
      btn.onclick = () => {
        const hit = hits[+btn.dataset.addHit];
        if (!hit) return;
        addItemToInput(hit.name, { code: hit.code, toMaster: state.itemAddToMaster, yomi: hit.yomi });
      };
    });
  }

  const saveBtn = document.getElementById("btn-save");
  const issueBtn = document.getElementById("btn-issue");
  if (saveBtn) saveBtn.onclick = saveLedger;
  if (issueBtn) {
    issueBtn.onclick = () => { issueToSlip(); };
  }

  const paperScanBtn = document.getElementById("btn-paper-scan");
  const paperScanInput = document.getElementById("paper-scan-input");
  if (paperScanBtn && paperScanInput) {
    paperScanBtn.onclick = () => openPaperScanPicker();
    paperScanInput.onchange = async () => {
      const file = paperScanInput.files && paperScanInput.files[0];
      if (!file) return;
      await startPaperScanFromFile(file);
      paperScanInput.value = "";
    };
  }
  if (state.paperScan) {
    const cancel = document.getElementById("paper-scan-cancel");
    if (cancel) cancel.onclick = () => { state.paperScan = null; render(); };
    const apply = document.getElementById("paper-scan-apply");
    if (apply) apply.onclick = () => {
      document.querySelectorAll("[data-paper-qty]").forEach(inp => {
        const i = +inp.dataset.paperQty;
        if (state.paperScan.rows[i]) state.paperScan.rows[i].qty = String(inp.value || "").trim();
      });
      applyPaperScanToItems();
    };
    const overlay = document.getElementById("paper-scan-overlay");
    if (overlay) overlay.onclick = e => {
      if (e.target === overlay && !state.paperScan.busy) { state.paperScan = null; render(); }
    };
  }

  const photoBtn = document.getElementById("btn-photo-memo");
  const photoInput = document.getElementById("photo-memo-input");
  if (photoBtn && photoInput) {
    photoBtn.onclick = () => {
      if (!state.customer) { toast("先に客先を選んでください", "error"); return; }
      if (currentPhotoMemos().length >= PHOTO_MEMO_MAX) {
        toast(`この客先の写真メモは最大${PHOTO_MEMO_MAX}枚までです`, "error");
        return;
      }
      photoInput.value = "";
      photoInput.click();
    };
    photoInput.onchange = async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      await addPhotoMemoFromFile(file);
      photoInput.value = "";
    };
  }
  document.querySelectorAll("[data-photo-del]").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      removePhotoMemo(btn.dataset.photoDel);
    };
  });
  document.querySelectorAll("[data-photo-view]").forEach(img => {
    img.onclick = () => {
      const p = currentPhotoMemos().find(x => x.id === img.dataset.photoView);
      if (p?.dataUrl) { state.photoView = p.dataUrl; render(); }
    };
  });
  document.querySelectorAll("[data-photo-view-url]").forEach(img => {
    img.onclick = () => {
      if (img.src) { state.photoView = img.src; render(); }
    };
  });
  const photoViewClose = document.getElementById("photo-view-close");
  if (photoViewClose) photoViewClose.onclick = () => { state.photoView = null; render(); };
  const photoViewOverlay = document.getElementById("photo-view-overlay");
  if (photoViewOverlay) photoViewOverlay.onclick = e => {
    if (e.target === photoViewOverlay) { state.photoView = null; render(); }
  };

  if (state.tab === 1) {
    const refreshBtn = document.getElementById("btn-refresh-history");
    if (refreshBtn) refreshBtn.onclick = async () => {
      try {
        if (!state.demoMode) await loadLedgersFromCloud();
        await mergeSharedPhotosToLedgers();
        toast("履歴を更新しました");
      } catch { toast("更新に失敗しました", "error"); }
      render();
    };
    const clearBtn = document.getElementById("btn-clear-history");
    if (clearBtn) clearBtn.onclick = async () => {
      const ok = await clearAllLedgerHistory();
      if (ok) render();
    };
    document.querySelectorAll(".history-row").forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        state.detail = state.ledgers.find(l => ledgerIdEq(l.id, id)) || null;
        render();
      };
    });
  }

  if (state.tab === 2) {
    document.querySelectorAll("[data-master-section]").forEach(btn => {
      btn.onclick = () => {
        state.masterSection = btn.dataset.masterSection;
        render();
      };
    });
    const addCust = document.getElementById("master-add-customer");
    if (addCust) addCust.onclick = () => openMasterCustomerForm("add");
    const sortCust = document.getElementById("master-sort-customers");
    if (sortCust) sortCust.onclick = () => sortCustomersByName();
    document.querySelectorAll("[data-master-customer-name]").forEach(btn => {
      btn.onclick = () => openMasterCustomerForm("edit", btn.dataset.masterCustomerName);
    });
    document.querySelectorAll("[data-master-del-customer-name]").forEach(btn => {
      btn.onclick = () => deleteMasterCustomer(btn.dataset.masterDelCustomerName);
    });
    document.querySelectorAll("[data-master-move]").forEach(btn => {
      btn.onclick = () => moveCustomer(btn.dataset.masterMove, +btn.dataset.dir, btn.dataset.masterMoveGroup || "");
    });
    const addGroup = document.getElementById("master-add-group");
    if (addGroup) addGroup.onclick = () => openMasterGroupForm("add");
    document.querySelectorAll("[data-group-edit]").forEach(btn => {
      btn.onclick = () => openMasterGroupForm("edit", btn.dataset.groupEdit);
    });
    document.querySelectorAll("[data-group-del]").forEach(btn => {
      btn.onclick = () => deleteMasterGroup(btn.dataset.groupDel);
    });
    document.querySelectorAll("[data-group-move]").forEach(btn => {
      btn.onclick = () => moveGroup(btn.dataset.groupMove, +btn.dataset.dir);
    });
    const masterSel = document.getElementById("master-cust-select");
    if (masterSel) masterSel.onchange = e => {
      state.masterCustomer = e.target.value;
      state.masterItemQuery = "";
      state.masterItemKanaRow = "all";
      render();
    };
    const masterKana = document.getElementById("master-item-kana");
    if (masterKana) masterKana.onchange = e => {
      state.masterItemKanaRow = e.target.value;
      render();
    };
    const masterQuery = document.getElementById("master-item-query");
    if (masterQuery) {
      masterQuery.oninput = e => {
        state.masterItemQuery = e.target.value;
        render();
        const q = document.getElementById("master-item-query");
        if (q) {
          q.focus();
          const len = q.value.length;
          q.setSelectionRange(len, len);
        }
      };
    }
    document.querySelectorAll("[data-master-cols]").forEach(btn => {
      btn.onclick = () => setMasterItemCols(+btn.dataset.masterCols);
    });
    const mzOut = document.getElementById("master-zoom-out");
    const mzIn = document.getElementById("master-zoom-in");
    if (mzOut) mzOut.onclick = () => setMasterItemZoom(state.masterItemZoom - ZOOM_STEP);
    if (mzIn) mzIn.onclick = () => setMasterItemZoom(state.masterItemZoom + ZOOM_STEP);
    const addItem = document.getElementById("master-add-item");
    if (addItem) addItem.onclick = () => openMasterItemForm("add", state.masterCustomer);
    document.querySelectorAll("[data-master-edit-item]").forEach(btn => {
      btn.onclick = () => openMasterItemForm("edit", state.masterCustomer, +btn.dataset.masterEditItem);
    });
    document.querySelectorAll("[data-master-del-item]").forEach(btn => {
      btn.onclick = () => deleteMasterItem(state.masterCustomer, +btn.dataset.masterDelItem);
    });
    document.querySelectorAll("[data-master-move-item]").forEach(btn => {
      btn.onclick = () => moveMasterItem(state.masterCustomer, +btn.dataset.masterMoveItem, +btn.dataset.dir);
    });
  }

  const masterSave = document.getElementById("master-form-save");
  const masterCancel = document.getElementById("master-form-cancel");
  const masterOverlay = document.getElementById("master-form-overlay");
  if (masterSave) masterSave.onclick = () => submitMasterForm();
  if (masterCancel) masterCancel.onclick = () => { state.masterForm = null; render(); };
  if (masterOverlay) masterOverlay.onclick = e => { if (e.target === masterOverlay) { state.masterForm = null; render(); } };
  const masterNameInput = document.getElementById("master-form-name");
  if (masterNameInput) {
    masterNameInput.oninput = e => {
      if (state.masterForm) state.masterForm.name = e.target.value;
    };
    masterNameInput.onkeydown = e => { if (e.key === "Enter") submitMasterForm(); };
  }
  const masterYomiInput = document.getElementById("master-form-yomi");
  if (masterYomiInput) {
    masterYomiInput.oninput = e => {
      if (state.masterForm) state.masterForm.yomi = e.target.value;
    };
  }
  const masterCodeInput = document.getElementById("master-form-code");
  if (masterCodeInput) {
    masterCodeInput.oninput = e => {
      if (state.masterForm) state.masterForm.code = e.target.value;
    };
  }
  const formSearchKana = document.getElementById("master-form-search-kana");
  if (formSearchKana && state.masterForm) {
    formSearchKana.onchange = e => {
      state.masterForm.searchKana = e.target.value;
      render();
    };
  }
  const formSearchQuery = document.getElementById("master-form-search-query");
  if (formSearchQuery && state.masterForm) {
    formSearchQuery.oninput = e => {
      state.masterForm.searchQuery = e.target.value;
      render();
      const q = document.getElementById("master-form-search-query");
      if (q) {
        q.focus();
        const len = q.value.length;
        q.setSelectionRange(len, len);
      }
    };
  }
  if (state.masterForm?.kind === "item" && state.masterForm.mode === "add") {
    const custName = state.masterForm.customer || state.masterCustomer;
    const formHits = searchItemsForMasterAdd(
      custName,
      state.masterForm.searchQuery || "",
      state.masterForm.searchKana || "all"
    );
    document.querySelectorAll("[data-master-pick]").forEach(btn => {
      btn.onclick = () => {
        const hit = formHits[+btn.dataset.masterPick];
        if (!hit || !state.masterForm) return;
        state.masterForm.name = hit.name;
        state.masterForm.yomi = hit.yomi || "";
        toast("既存品目をコピーしました。保存でこの客先に登録できます");
        render();
      };
    });
  }

  document.querySelectorAll(".nk").forEach(btn => {
    btn.onclick = () => numpadPress(btn.dataset.k);
  });

  const closeBtn = document.getElementById("detail-close");
  if (closeBtn) closeBtn.onclick = () => { state.detail = null; render(); };
  const detailDeleteBtn = document.getElementById("detail-delete");
  if (detailDeleteBtn) detailDeleteBtn.onclick = async () => {
    const target = state.detail;
    const ok = await deleteLedgerRecord(target);
    if (ok) {
      state.detail = null;
      render();
    }
  };
  const overlay = document.getElementById("detail-overlay");
  if (overlay) overlay.onclick = e => { if (e.target === overlay) { state.detail = null; render(); } };

  const memoClose = document.getElementById("memo-close");
  if (memoClose) memoClose.onclick = () => { state.invoiceMemo = null; render(); };
  const memoOverlay = document.getElementById("memo-overlay");
  if (memoOverlay) memoOverlay.onclick = e => { if (e.target === memoOverlay) { state.invoiceMemo = null; render(); } };
  bindInstallButtons();
}

function startDemoMode() {
  state.demoMode = true;
  window.bootApp();
}

/** 本番のログイン省略起動（デモ連動にしない・クラウド共有する） */
function startProductionSkipLogin() {
  state.demoMode = false;
  if (!state.userDisplayName && !state.userShortId) {
    state.userDisplayName = "現場";
  }
  markSessionDay();
  window.bootApp();
}

/** ?clearHistory=1 でこの端末の台帳履歴（localStorage）を消す。クラウドの ledgerRecords も空なら0件になる */
function clearLocalLedgerHistoryIfRequested() {
  try {
    const sp = new URLSearchParams(location.search);
    if (sp.get("clearHistory") !== "1") return false;
    ["lg_ledgers", "lg_ledgers_demo", "lg_ledgers_trial"].forEach(k => {
      try { localStorage.removeItem(k); } catch {}
    });
    state.ledgers = [];
    sp.delete("clearHistory");
    const q = sp.toString();
    const next = location.pathname + (q ? `?${q}` : "") + location.hash;
    history.replaceState(null, "", next);
    return true;
  } catch {
    return false;
  }
}

window.bootApp = async function() {
  const cleared = clearLocalLedgerHistoryIfRequested();
  if (!state.deliveryDate) state.deliveryDate = todayInput();
  await loadMasters();
  try { await mergeSharedPhotosToLedgers(); } catch {}
  if (cleared) toast("この端末の台帳履歴を消しました");
  if (!window._photoDraftPoll) {
    window._photoDraftPoll = setInterval(async () => {
      if (!isActiveSession() || state.tab !== 0 || !state.customer || state.loading) return;
      try {
        const changed = await pullSharedPhotoDraft();
        if (changed) render();
      } catch {}
    }, 20000);
  }
  registerServiceWorkerLater();
};

async function startApp() {
  for (const mode of [indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence]) {
    try {
      await setPersistence(auth, mode);
      break;
    } catch {}
  }
  onAuthStateChanged(auth, async user => {
    // デモURL・localhost だけ端末内デモ。本番はクラウド共有
    if (USE_LOCAL_DEMO) {
      startDemoMode();
      return;
    }
    if (user) {
      const saved = localStorage.getItem(SESSION_DAY_KEY);
      const today = sessionDayKey();
      if (saved && saved !== today) {
        await signOut(auth);
        clearSessionDay();
        state.userShortId = "";
        state.userDisplayName = "";
        if (SKIP_LOGIN) {
          startProductionSkipLogin();
          return;
        }
        renderLogin("日付が変わりました。朝いちどログインしてください。");
        return;
      }
      if (!state.userDisplayName && !state.userShortId) {
        await loadUserProfile(user.uid);
      }
      markSessionDay();
      state.demoMode = false;
      window.bootApp();
      return;
    }
    if (SKIP_LOGIN) {
      startProductionSkipLogin();
      return;
    }
    renderLogin();
  }, err => {
    console.error(err);
    if (USE_LOCAL_DEMO) {
      startDemoMode();
      return;
    }
    if (SKIP_LOGIN) {
      startProductionSkipLogin();
      return;
    }
    renderLogin("接続エラーです。ネットワークを確認して再試行してください。");
  });
}

if (IS_DEMO) {
  window.addEventListener("storage", e => {
    if (e.key !== BRIDGE_V14_KEY && e.key !== BRIDGE_REV_KEY) return;
    const pulled = pullMastersFromSlipBridge();
    if (pulled !== true) return;
    if (state.customer) loadCustomerItems(state.customer);
    if (state.masterCustomer) {
      /* keep */
    }
    render();
    toast("伝票デモのマスタを反映しました");
  });
}

startApp().catch(err => {
  console.error(err);
  if (USE_LOCAL_DEMO) {
    startDemoMode();
    return;
  }
  renderLogin("起動に失敗しました。アプリを削除して再インストールしてください。");
});

window.addEventListener("error", e => {
  const root = document.getElementById("root");
  if (!root) return;
  root.innerHTML = `<div class="login-wrap"><div class="login-card"><h1>入出荷台帳</h1><p style="color:#c62828">起動エラーが発生しました。</p><p style="font-size:13px;margin-top:12px;line-height:1.6">① ホーム画面のアイコンを削除<br>② ブラウザでこのページを開き直す<br>③ 再インストール</p></div></div>`;
});
</script>
